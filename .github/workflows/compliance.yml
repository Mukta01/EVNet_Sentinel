name: Epic Compliance Checks

on:
  pull_request:
    branches: [ "main" ]

jobs:
  compliance:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # We install pytest and pandas since some tests read CSVs to check for column existence.
        pip install pytest pandas

    - name: Run Epic Compliance Test Suite
      run: |
        pytest tests/ -v

name: Epic Compliance Checks

on:
  pull_request:
    branches: [ "main" ]

jobs:
  compliance:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      # Must match the version requirements.txt was pinned against. The pins are
      # exact on purpose (issue #55) -- River's API shifted around 0.21 and
      # scikit-learn's class_weight and tree-splitting behaviour has changed
      # across minor releases -- and several of them need >=3.11, so an older
      # interpreter fails at install time before any test runs.
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install project dependencies plus pytest
        pip install -r requirements.txt pytest

    - name: Run Epic Compliance Test Suite
      run: |
        pytest tests/ -v
